<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Weather App</title>
    </head>
    <body>
        <!-- nav bar -->
        <div id="navigation"></div>

        <!-- search and buttons -->
        <div id="search"></div>
        <div id="buttons"></div>

        <!-- hero banner -->
        <div id="hero-banner"></div>

        <!-- main content -->
        <!-- surfers -->
        <div class="container card">
            <div class="row">
            <h2 class="surf-header">Surf-o-meter</h2>
            </div>

            <div class="surf-image row">
                <img src="surf.jpg" alt="Surfing" />
            </div>

            <div class="row">
                <p class="col card-text">Wind speed</p>
                <p id="wind-speed-data" class="col">15 km/h</p>
            </div>

            <div class="row">
                <p class="col card-text">Wind direction</p>
                <p id="wind-direction-data" class="col">NW</p>
            </div>
        </div>
        <!-- tomatoes -->
        <div id="tomatoes" class="container">
            <div class="row">
                <div class="card">
                    <img
                        src="tomatobackground.jpg"
                        class="card-img-top"
                        alt="background image of tomatofarmer"
                    />
                    <div class="card-body">
                        <div class="row">
                            <h5 class="card-title">Tomatometer</h5>
                            <div class="col">
                                <p class="card-text">humidity:</p>
                                <div
                                    id="humidity-meter"
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Example with label"
                                    aria-valuenow="25"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div
                                        id="humidity-text"
                                        class="progress-bar"
                                        style="width: 25%"
                                    >
                                        25%
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <p class="col card-text">rain:</p>
                                    <div
                                        id="rain-meter"
                                        class="col progress progress-vertical"
                                        role="progressbar"
                                        aria-label="Example with label"
                                        aria-valuenow="60"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >
                                        <div
                                            id="rain-text"
                                            class="progress-bar"
                                            style="height: 60%"
                                        >
                                            60%
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- vampires -->
        <div id="vampires" class="container my-4">
            <div class="row">
                <div class="card p-0">
                    <img
                        src="generated-image-975c38f6-facb-4e85-9c13-4b826b85e05e (1).jpg"
                        class="card-img-top"
                        alt="vampire icon"
                    />

                    <div class="card-body">
                        <h5 class="card-title text-center mb-3">
                            Vampire-O-Meter
                        </h5>

                        <div class="row mb-2">
                            <div class="col">Temperature</div>
                            <div class="col text-end" id="vampire-temperature">
                                —
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col">Humidity</div>
                            <div class="col text-end" id="vampire-humidity">
                                —
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col">Hours sun</div>
                            <div class="col text-end" id="vampire-sunhours">
                                —
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col">Wind speed</div>
                            <div class="col text-end" id="vampire-windspeed">
                                —
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="surfers.js"></script>
        <script src="tomatoes.js"></script>
        <script src="vampires.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
