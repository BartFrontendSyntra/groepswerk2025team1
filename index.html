<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Weather App</title>
    </head>
    <body>
        <!-- nav bar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Niche Weather Dashboard</a>

                <!-- Hamburger icon -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarContent"
                >
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- NAV CONTENT -->
                <div class="collapse navbar-collapse" id="navbarContent">
                    <!-- CENTER SEARCHBAR -->
                    <form
                        class="d-flex mx-auto"
                        style="max-width: 500px; width: 100%"
                    >
                        <div class="input-group">
                            <input
                                id="search-location"
                                class="form-control"
                                type="search"
                                placeholder="Search location..."
                                aria-label="Search"
                            />
                            <button
                                id="search-button"
                                class="btn btn-primary"
                                type="submit"
                            >
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </form>

                    <!-- RIGHT SIDE LINKS -->
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="#surfers">Surfers</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#tomatoes">Tomatoes</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="#vampires">Vampires</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="#surfers">Surfers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#tomatoes">Tomatoes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#vampires">Vampires</a>
                </li>
            </ul>
        </div>

        <!-- hero banner -->
        <div id="hero-banner">
            <div class="container card my-gradient  p-0">
                <div class="row custom-margin">
                    <h2 id="location" class="surf-header card-title text-center">
                    </h2>
                </div>

                <div class="hero-image">
                    <img class="card-img-top" src="herobanner2.png" alt="Fine" />
                </div>
                <div class="row justify-content-center">
                    <p class="col-12 mt-3 m-3 mx-5 custom-text text-center">Previous locations</p>
                    </div>
                    <div class="row p-2">
                        <div id="previous-locations" class="col mt-3 text-center">
                        <button class="previous-location-button btn btn-secondary btn-sm">
                            Test
                        </button>
                        <button class="previous-location-button btn btn-secondary btn-sm">
                            Test
                        </button>
                        <button class="previous-location-button btn btn-secondary btn-sm">
                            Test
                        </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- main content -->
        <!-- surfers -->
        <div id="surfers" class="container card my-5 surfcontainer p-0">
            <div class="row">
                <h2 class="surf-header card-title text-center mt-2">Surf-O-meter</h2>
            </div>

            <div class="surf-image">
                <img src="surfer.png" alt="Surfing" class="card-img-top"/>
            </div>

            <div class="row">
                <p class="col card-text mt-3 mx-5 custom-text">Wind speed</p>
                <p id="wind-speed-data" class="col mt-3 custom-text">15 km/h</p>
            </div>

            <div class="row">
                <p class="col card-text mx-5 custom-text">Wind direction</p>
                <p id="wind-direction-data" class="col custom-text">NW</p>
            </div>
        </div>
        <!-- tomatoes -->
        <div id="tomatoes" class="container my-5">
            <div class="row">
                <div class="card p-0">
                    <h2 class="card-title text-center mt-2">Tomat-O-Meter</h2>
                    <img
                        src="tomato.png"
                        class="card-img-top"
                        alt="background image of tomatofarmer"
                    />
                    <div class="card-body">
                        <div class="row">
                            <div class="col">
                                <p class="card-text mx-5 custom-text">Humidity</p>
                                <div
                                    id="humidity-meter"
                                    class="progress mb-2"
                                    role="progressbar"
                                    aria-label="Example with label"
                                    aria-valuenow="25"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div
                                        id="humidity-text"
                                        class="progress-bar"
                                        style="width: 25%"
                                    >
                                        25%
                                    </div>
                                </div>
                                <p class="card-text mx-5 custom-text">Temperature</p>
                                <div id="temperature" class="card-text mx-5 custom-text"></div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <p class="col card-text custom-text">Rain</p>
                                    <div id="no-rain"></div>
                                    <div
                                        id="rain-meter"
                                        class="col progress progress-vertical"
                                        role="progressbar"
                                        aria-label="Example with label"
                                        aria-valuenow="60"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >
                                        <div
                                            id="rain-text"
                                            class="progress-bar"
                                            style="height: 60%"
                                        >
                                            60%
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- vampires -->
        <div id="vampires" class="container my-5">
            <div class="row">
                <div class="card p-0">
                    <h2 class="card-title text-center my-3">
                        Vampire-O-Meter
                    </h2>
                    <img
                        src="vampire.png"
                        class="card-img-top"
                        alt="vampire icon"
                    />

                    <div class="card-body">
                        <div class="row mb-2 mx-5">
                            <div class="col custom-text">Sunrise</div>
                            <div class="col text-end me-5 custom-text" id="vampire-sunrise">
                                —
                            </div>
                        </div>

                        <div class="row mb-2 mx-5">
                            <div class="col custom-text">Sunset</div>
                            <div class="col text-end me-5 custom-text" id="vampire-sunset">
                                —
                            </div>
                        </div>

                        <div class="row mb-2 mx-5">
                            <div class="col custom-text">Cloud coverage</div>
                            <div class="col text-end me-5 custom-text" id="vampire-cloudcover">
                                —
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="secret-key.js"></script>
        <script src="tomatoes.js"></script>
        <script src="surfers.js"></script>
        <script src="vampires.js"></script>
        <script src="app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
