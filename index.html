<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Weather App</title>
</head>
<body>
    <!-- nav bar -->
    <div id="navigation"></div>
    
    <!-- search and buttons -->
    <div id="search"></div>
    <div id="buttons"></div>
    
    <!-- hero banner -->
     <div id="hero-banner"></div>
     
    <!-- main content -->
     <!-- surfers -->
    <div id="surfers">
        
    </div>

    <!-- tomatoes -->
    <div id="tomatoes">
        
    </div>
    
    <!-- vampires -->
    <div id="vampires">
    <div class="image-wrapper">
        <img src="generated-image-975c38f6-facb-4e85-9c13-4b826b85e05e (1).jpg" alt="vampire icon" class="icon">
    </div>
    
    <div class="vampire-info">
        <div class="row">
            <span>Temperature</span>
            <span id="vampire-temperature">—</span>
        </div>
    
        <div class="row">
            <span>Humidity</span>
            <span id="vampire-humidity">—</span>
        </div>
    
        <div class="row">
            <span>Hours sun</span>
            <span id="vampire-sunhours">—</span>
        </div>
    
        <div class="row">
            <span>Wind speed</span>
            <span id="vampire-windspeed">—</span>
        </div>
    </div>
    <script src="surfers.js"></script>
    <script src="tomatoes.js"></script>
    <script src="vampires.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
