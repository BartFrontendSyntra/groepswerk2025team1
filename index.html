<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
        <title>Weather App</title>
    </head>
    <body>
        <!-- nav bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container-fluid">

        
        <a class="navbar-brand" href="#">Niche Weather Dashboard</a>

        <!-- Hamburger icon -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAV CONTENT -->
        <div class="collapse navbar-collapse" id="navbarContent">

            <!-- CENTER SEARCHBAR -->
            <form class="d-flex mx-auto" style="max-width: 500px; width: 100%;">
                <div class="input-group">
                    <input
                        id="search-location"
                        class="form-control"
                        type="search"
                        placeholder="Search location..."
                        aria-label="Search"
                    />
                    <button
                        id="search-button"
                        class="btn btn-primary"
                        type="submit"
                    >
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <!-- RIGHT SIDE LINKS -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link" href="#surfers">Surfers</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#tomatoes">Tomatoes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#vampires">Vampires</a>
                </li>

            </ul>
        </div>
    </div>
</nav>
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link" href="#surfers">Surfers</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#tomatoes">Tomatoes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#vampires">Vampires</a>
        </li>

      </ul>
    </div>
  </div>
</nav>  
        </nav>

        <!-- hero banner -->
        <div id="hero-banner">
            <div id="location"></div>
        </div>

        <!-- main content -->
        <!-- surfers -->
        <div id="surfers" class="container card">
            <div class="row">
                <h2 class="surf-header card-title">Surf-o-meter</h2>
            </div>

            <div class="surf-image row">
                <img src="surf.jpg" alt="Surfing" />
            </div>

            <div class="row">
                <p class="col card-text">Wind speed</p>
                <p id="wind-speed-data" class="col">15 km/h</p>
            </div>

            <div class="row">
                <p class="col card-text">Wind direction</p>
                <p id="wind-direction-data" class="col">NW</p>
            </div>
        </div>
        <!-- tomatoes -->
        <div id="tomatoes" class="container">
            <div class="row">
                <div class="card">
                    <h2 class="card-title">Tomatometer</h2>
                    <img
                        src="tomatobackground.jpg"
                        class="card-img-top"
                        alt="background image of tomatofarmer"
                    />
                    <div class="card-body">
                        <div class="row">
                            
                            <div class="col">
                                <p class="card-text">humidity:</p>
                                <div
                                    id="humidity-meter"
                                    class="progress"
                                    role="progressbar"
                                    aria-label="Example with label"
                                    aria-valuenow="25"
                                    aria-valuemin="0"
                                    aria-valuemax="100"
                                >
                                    <div
                                        id="humidity-text"
                                        class="progress-bar"
                                        style="width: 25%"
                                    >
                                        25%
                                    </div>
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <p class="col card-text">rain:</p>
                                    <div
                                        id="rain-meter"
                                        class="col progress progress-vertical"
                                        role="progressbar"
                                        aria-label="Example with label"
                                        aria-valuenow="60"
                                        aria-valuemin="0"
                                        aria-valuemax="100"
                                    >
                                        <div
                                            id="rain-text"
                                            class="progress-bar"
                                            style="height: 60%"
                                        >
                                            60%
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- vampires -->
        <div id="vampires" class="container my-4">
            <div class="row">
                <div class="card p-0">
                    <img
                        src="generated-image-975c38f6-facb-4e85-9c13-4b826b85e05e (1).jpg"
                        class="card-img-top"
                        alt="vampire icon"
                    />

                    <div class="card-body">
                        <h5 class="card-title text-center mb-3">
                            Vampire-O-Meter
                        </h5>

                        <div class="row mb-2">
                            <div class="col">Sun rise</div>
                            <div class="col text-end" id="vampire-sunrise">
                                —
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col">Sunset</div>
                            <div class="col text-end" id="vampire-sunset">
                                —
                            </div>
                        </div>

                        <div class="row mb-2">
                            <div class="col">Cloud cover</div>
                            <div class="col text-end" id="vampire-cloudcover">
                                —
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <script src="secret-key.js"></script>
        <script src="tomatoes.js"></script>
        <script src="surfers.js"></script>
        <script src="vampires.js"></script>
        <script src="app.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
