<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Weather App</title>
</head>
<body>
    <!-- nav bar -->
    <div id="navigation"></div>
    
    <!-- search and buttons -->
    <div id="search"></div>
    <div id="buttons"></div>
    
    <!-- hero banner -->
     <div id="hero-banner"></div>
     
    <!-- main content -->
     <!-- surfers -->
    <div class="surf-container">
  
    <h2 class="surf-header">Surf-o-meter</h2>

    <div class="surf-image">
        <img src="surf.jpg" alt="Surfing">
    </div>

    <div class="surf-row">
        <span>Wind speed</span>
        <span id="wind-speed-data">15 km/h</span> </div>

    <div class="surf-row">
        <span>Wind direction</span>
        <span id="wind-direction-data">NW</span> </div>

    </div>

    <!-- tomatoes -->
    <div id="tomatoes">
        
    </div>
    
    <!-- vampires -->
    <div id="vampires">
        
    </div>

    

    <script src="surfers.js"></script>
    <script src="tomatoes.js"></script>
    <script src="vampires.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
